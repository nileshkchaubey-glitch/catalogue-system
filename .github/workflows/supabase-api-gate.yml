name: Catalogue Supabase API gate

on:
  push:
    branches:
      - feat/supabase-api-gate-20261127
    paths:
      - .github/workflows/supabase-api-gate.yml

permissions:
  contents: read

concurrency:
  group: catalogue-supabase-api-gate-20261127
  cancel-in-progress: false

jobs:
  integration:
    # Only the first fast-forward from the approved candidate runs this job.
    if: >-
      github.repository == 'nileshkchaubey-glitch/catalogue-system' &&
      github.event.before == '06fd541b2eab42ecda9b6f7744c8f53a27db2327' &&
      !github.event.created && !github.event.deleted && !github.event.forced &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
      - name: Verify checkout, install, test and build
        timeout-minutes: 3
        run: |
          set -euo pipefail
          candidate=06fd541b2eab42ecda9b6f7744c8f53a27db2327
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $candidate"
          git diff --quiet "$candidate" HEAD -- supabase/ tests/integration/legacy-foundation.sql
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Install pinned Supabase CLI
        timeout-minutes: 2
        run: |
          set -euo pipefail
          SUPABASE_CLI_VERSION="$(node -p 'require("./tests/integration/supabase-runtime.json").cli.version')"
          SUPABASE_CLI_SHA256="$(node -p 'require("./tests/integration/supabase-runtime.json").cli.linuxAmd64Sha256')"
          archive="$RUNNER_TEMP/supabase_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/supabase/cli/releases/download/v$SUPABASE_CLI_VERSION/supabase_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SUPABASE_CLI_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/supabase-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-bin" supabase
          test "$("$RUNNER_TEMP/supabase-bin/supabase" --version)" = "$SUPABASE_CLI_VERSION"
          printf '%s\n' "$RUNNER_TEMP/supabase-bin" >> "$GITHUB_PATH"
      - name: Start disposable stack and verify legacy reconciliation fixture
        timeout-minutes: 8
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          umask 077
          gate="$RUNNER_TEMP/catalogue-supabase-gate"
          mkdir -p "$gate/supabase"
          sed 's/^project_id = .*/project_id = "catalogue-api-gate-disposable"/' \
            supabase/config.toml > "$gate/supabase/config.toml"
          docker info > /dev/null
          node tests/integration/supabase-api.mjs prepare-runtime
          if ! supabase --workdir "$gate" start \
            --exclude studio,pgmeta,edge-runtime,realtime,imgproxy,logflare,vector,supavisor > "$gate/start.log" 2>&1; then
            printf '%s\n' 'Supabase startup failed. Container states follow.'
            docker ps -a --format '{{.Names}} {{.Status}}'
            exit 1
          fi
          printf '%s\n' 'Disposable Docker stack started.'
          node tests/integration/supabase-api.mjs preflight
      - name: Apply versioned migrations over the container-local socket
        timeout-minutes: 2
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: node tests/integration/supabase-api.mjs migrate
      - name: Verify packaged Worker and real Supabase HTTP APIs
        timeout-minutes: 5
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: node tests/integration/supabase-api.mjs
      - name: Stop disposable stack
        if: always()
        timeout-minutes: 2
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/catalogue-supabase-gate"
          if [ -f "$gate/supabase/config.toml" ]; then
            trap 'rm -f -- "$gate/start.log"' EXIT
            if ! timeout 90s supabase --workdir "$gate" stop --no-backup > /dev/null 2>&1; then
              printf '%s\n' 'Disposable Supabase cleanup failed.'
              exit 1
            fi
            label='label=com.supabase.cli.project=catalogue-api-gate-disposable'
            if ! containers=$(docker ps -aq --filter "$label" 2>/dev/null) ||
               ! volumes=$(docker volume ls -q --filter "$label" 2>/dev/null) ||
               ! networks=$(docker network ls -q --filter "$label" 2>/dev/null); then
              printf '%s\n' 'Could not verify disposable Docker resource cleanup.'
              exit 1
            fi
            if [ -n "$containers$volumes$networks" ]; then
              printf '%s\n' 'Disposable Docker resources remain after cleanup.'
              exit 1
            fi
            printf '%s\n' 'Disposable Supabase stack stopped. No labeled Docker resources remain.'
          fi
